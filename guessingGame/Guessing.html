
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="guessing.js" defer></script>
</head>
<body>

    <header>
        <h1>Guess the Number!</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="inspiration.html">Inspiration</a>
        <a href="calculator.html">Tip Calculator</a>
        <a href="guessing.html">Guessing Game</a>
    </nav>

    <main>
        <h2>Number Guessing Game</h2>

        <p>I'm thinking of a number between 1 and 100.</p>
        <p>You have 10 tries to guess it!</p>

        <form id="guessForm">
            <label for="guess">Enter your guess:</label>

            <input
                type="number"
                id="guess"
                min="1"
                max="100"
                required
            >

            <button type="submit">Submit Guess</button>
        </form>

        <p id="result"></p>
        <p id="previousGuesses"></p>
        <p id="turns"></p>

        <button id="restart" type="button" hidden>
            Play Again
        </button>
    </main>

    <footer>
        <p>Michael's Webpage Project</p>
    </footer>

</body>
</html>
